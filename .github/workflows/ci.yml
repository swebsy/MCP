# Published to github.com/swebsy/MCP as .github/workflows/ci.yml by
# scripts/mirror-mcp.sh. Edit it here, in the monorepo — the copy in the public
# repo is regenerated on every sync.
#
# Its job is to prove the mirrored tree builds and tests standalone with plain
# npm (no pnpm workspace), which is exactly what the MCP directories check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - run: npm install
      - run: npm test
      - run: npm run build

  # ponytail: npm publishes from HERE now, not from the private monorepo that
  # generates this repo. npm Trusted Publishing binds ONE repo + workflow
  # filename per package, so the binding on npmjs.com is swebsy/MCP + ci.yml —
  # renaming this file, or moving the job, breaks publishing until that setting
  # is changed to match. Publishing from the public repo is also what makes
  # --provenance truthful: the attestation names the repo the source lives in.
  publish:
    name: Publish @swebsy/mcp to npm
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN
    steps:
      - uses: actions/checkout@v5

      # ponytail: no registry-url here on purpose — it writes an .npmrc
      # _authToken placeholder that shadows OIDC auth.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x

      # Trusted publishing needs npm >= 11.5.1, newer than some runner images ship.
      - run: npm install -g npm@latest

      # ponytail: the npm registry is the source of truth for "already
      # published" — this repo re-syncs on every README change and must not
      # republish. prepublishOnly runs the build, hence the install first.
      - name: Publish if this version is new
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@swebsy/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@swebsy/mcp@$VERSION already published — nothing to do."
            exit 0
          fi
          npm install
          npm publish --access public --provenance

  # ponytail: the registry publish lives HERE, in the public mirror, not in the
  # monorepo that builds and npm-publishes the package. The registry derives the
  # namespace it grants from the OIDC token's repository_owner, so only a
  # workflow running under the swebsy org can claim io.github.swebsy/*. That is
  # also why there is no token to store: OIDC replaces it.
  registry:
    name: Publish to the MCP registry
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC -> io.github.swebsy/*
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Publish server.json if this version is new
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./server.json').version")

          # The registry itself is the source of truth for "already published" —
          # this repo re-syncs on every README change and must not republish.
          # search= is a substring match, hence the exact-name check.
          if node -e '
            const [name, version] = process.argv.slice(1);
            const url = "https://registry.modelcontextprotocol.io/v0/servers"
              + `?search=${encodeURIComponent(name)}&version=${encodeURIComponent(version)}`;
            fetch(url)
              .then((r) => r.json())
              .then((j) => {
                const hit = (j.servers ?? []).some((s) => s.server.name === name);
                process.exit(hit ? 0 : 1);
              });
          ' io.github.swebsy/mcp "$VERSION"; then
            echo "io.github.swebsy/mcp@$VERSION is already listed — nothing to do."
            exit 0
          fi

          # The publish job upstream already put this version on npm, but the
          # read path is CDN-fronted and lags the write by seconds. The registry
          # validates the npm package exists and carries a matching mcpName
          # before it accepts the version, so wait for it rather than race it.
          #
          # Six minutes, not one: 0.8.1 took 9 of these polls (~55s), and npm's
          # own publish output only promises "a few minutes". This job runs after
          # npm and the GitHub release have already shipped, so a timeout here
          # strands the registry behind a release that is otherwise complete —
          # far more expensive than idling a runner for five extra minutes.
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "https://registry.npmjs.org/@swebsy/mcp/$VERSION"; then break; fi
            echo "waiting for @swebsy/mcp@$VERSION to appear on npm..."
            sleep 6
          done
          curl -fsS -o /dev/null "https://registry.npmjs.org/@swebsy/mcp/$VERSION"

          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # Glama's Auto-Release rebuilds the listing on every GitHub release, so the
  # mirror has to cut one. It re-syncs on any source change, not just a version
  # bump, so this no-ops whenever the tag already exists. `gh release create`
  # makes the tag itself — nothing here needs push access or the deploy key.
  release:
    name: Cut a GitHub release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # --generate-notes diffs against the previous tag

      - name: Create v<version> if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released — nothing to do."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes
